name = "academyverso-api"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
GITHUB_REPO = "davidop/academyverso-2026"
# Keep disabled until migration and live model are validated.
WORLDGEN_ENABLED = "false"
ALLOWED_ORIGIN = "https://davidop.github.io"
# Login exacto de la GitHub App de triage (mismo valor que la variable de
# Actions ACADEMYVERSO_TRIAGE_BOT, terminado en [bot]). Configúrala en
# Cloudflare antes de aceptar payloads con triage_comment; sin este valor el
# Worker rechaza esa vía y conserva la ruta legacy del cuerpo de la Issue.
# TRIAGE_BOT = "nombre-de-la-app[bot]"

[[d1_databases]]
binding = "DB"
database_name = "academyverso"
database_id = "738e3af8-dd3a-40c5-9db1-3ba152ee0208"

# Enriquecimiento opcional con IA: requiere habilitar Workers AI y el binding AI.
# [ai]
# binding = "AI"
