name = "academyverso-api"
main = "src/index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
GITHUB_REPO = "davidop/academyverso-2026"
# Activado el 26/11/2026: migraciones 0001-0003 aplicadas y modelos validados con fixtures.
WORLDGEN_ENABLED = "true"
# Va junto con la variable de Actions ACADEMYVERSO_PLANET_FACTORY_ENABLED; no activar por separado.
PLANET_FACTORY_ENABLED = "true"
ALLOWED_ORIGIN = "https://davidop.github.io"
# Login exacto de la GitHub App de triage: mismo valor que la variable de
# Actions ACADEMYVERSO_TRIAGE_BOT, terminado en [bot]. Va aquí y no en el panel
# de Cloudflare porque `wrangler deploy` sustituye las variables por las de este
# bloque. Sin este valor el Worker rechaza la vía triage_comment (#67).
TRIAGE_BOT = "academyverso-triage[bot]"

[[d1_databases]]
binding = "DB"
database_name = "academyverso"
database_id = "738e3af8-dd3a-40c5-9db1-3ba152ee0208"

# Enriquecimiento opcional con IA: requiere habilitar Workers AI y el binding AI.
# [ai]
# binding = "AI"
