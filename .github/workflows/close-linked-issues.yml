name: Flujo de Issues · cerrar al fusionar en ramas de ensayo
# GitHub solo cierra Issues con "Closes #N" / "Fixes #N" / "Resolves #N" cuando
# la PR se fusiona en la rama por defecto. Este workflow hace lo mismo para PRs
# fusionadas en otras ramas (p. ej. demo/portal-seed-26nov). Reglas: scripts/issue_flow.py.
#
# IMPORTANTE: pull_request_target ejecuta la versión del workflow que hay en la
# rama BASE de la PR. Para que funcione con PRs hacia demo/portal-seed-26nov,
# este archivo y scripts/issue_flow.py deben existir también en esa rama.
#
# Seguridad: pull_request_target se usa para disponer de permiso de escritura
# en Issues también con PRs de forks. No se descarga el código de la PR sin
# fusionar: solo scripts/issue_flow.py de la rama base, tras la fusión.
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  issues: write
jobs:
  close-linked:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: scripts/issue_flow.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Cerrar Issues enlazadas por la PR fusionada
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/issue_flow.py close
