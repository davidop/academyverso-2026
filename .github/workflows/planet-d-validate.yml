name: Planet Factory D compile preview
on:
  pull_request:
    paths:
      - 'experiments/planet-factory-d/**'
      - '.github/workflows/planet-d-*.md'
      - '.github/workflows/planet-d-validate.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install gh-aw compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v1.2.3
      - name: Compile isolated workflow sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh aw compile .github/workflows/planet-d-sdk.md
          test -s .github/workflows/planet-d-sdk.lock.yml
      - name: Reject unexpected write permissions in generated workflows
        run: |
          ruby -ryaml -e 'ARGV.each { |p| d=YAML.safe_load_file(p, aliases: true); d.fetch("jobs",{}).merge("workflow"=>d).each { |name,j| perms=j["permissions"]; abort("Unexpected write permission in #{p} job #{name}: #{perms}") if perms=="write-all" || (perms.is_a?(Hash) && perms.values.include?("write")) } }' .github/workflows/planet-d-*.lock.yml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: planet-d-compiled-preview
          path: .github/workflows/planet-d-*.lock.yml
          if-no-files-found: error
          retention-days: 3
