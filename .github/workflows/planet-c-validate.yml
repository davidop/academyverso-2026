name: Planet Factory C compile preview
on:
  pull_request:
    paths:
      - 'experiments/planet-factory-c/**'
      - '.github/workflows/planet-c-*.md'
      - '.github/workflows/planet-c-validate.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test experiments/planet-factory-c/contract.test.mjs
      - name: Install pinned compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v1.2.3
      - name: Compile the three workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in .github/workflows/planet-c-{design,build,review}.md; do
            gh aw compile "$file"
            test -s "${file%.md}.lock.yml"
          done
          cp experiments/planet-factory-c/coordinator.yml .github/workflows/planet-factory-c.yml
      - name: Reject unexpected write permissions in generated workflows
        run: |
          ruby -ryaml -e 'ARGV.each { |p| d=YAML.safe_load_file(p, aliases: true); ([d]+d.fetch("jobs",{}).values).each { |j| perms=j["permissions"]; abort("Unexpected write permission in #{p}: #{perms}") if perms=="write-all" || (perms.is_a?(Hash) && perms.values.include?("write")) } }' .github/workflows/planet-c-*.lock.yml
      - uses: actions/upload-artifact@v4
        with:
          name: planet-c-compiled-preview
          path: |
            .github/workflows/planet-c-*.lock.yml
            .github/workflows/planet-factory-c.yml
          if-no-files-found: error
          retention-days: 3
