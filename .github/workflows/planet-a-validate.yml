name: Planet Factory A compile preview
on:
  pull_request:
    paths:
      - 'experiments/planet-factory-a/**'
      - '.github/workflows/planet-a-*.md'
      - '.github/workflows/planet-a-validate.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Evaluator and fixture tests
        run: node --test experiments/planet-factory-a/evaluate.test.mjs
      - name: Install gh-aw compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v1.2.3
      - name: Compile isolated workflow sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh aw compile .github/workflows/planet-a-auto.md
          test -s .github/workflows/planet-a-auto.lock.yml
          gh aw compile .github/workflows/planet-a-economy.md
          test -s .github/workflows/planet-a-economy.lock.yml
      - name: Committed locks match their sources
        # GitHub ejecuta los .lock.yml: si se edita el .md sin recompilar, el CI debe fallar.
        run: git diff --exit-code -- .github/workflows/
      - name: Reject unexpected write permissions in generated workflows
        run: |
          ruby -ryaml -e 'ARGV.each { |p| d=YAML.safe_load_file(p, aliases: true); d.fetch("jobs",{}).merge("workflow"=>d).each { |name,j| perms=j["permissions"]; abort("Unexpected write permission in #{p} job #{name}: #{perms}") if perms=="write-all" || (perms.is_a?(Hash) && perms.values.include?("write")) } }' .github/workflows/planet-a-*.lock.yml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: planet-a-compiled-preview
          path: .github/workflows/planet-a-*.lock.yml
          # warn: si la compilación falla, no añadir un segundo error que tape el real.
          if-no-files-found: warn
          retention-days: 3
