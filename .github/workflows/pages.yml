name: Deploy · GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Slidev dependencies
        working-directory: presentation
        run: npm install --no-audit --no-fund
      - name: Build AcademyVerso Slidev
        working-directory: presentation
        run: npm run build
      - name: Assemble 3D web and presentation
        shell: bash
        run: |
          mkdir -p site/presentation
          cp -R web/. site/
          cp -R presentation/dist/. site/presentation/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
