name: Deploy · GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and deploy run as separate jobs. With both in one job, deploy-pages
  # asked for the artifact ~3 s after the upload and kept finding none
  # ("No artifacts named github-pages"); a job boundary gives the artifact
  # time to be registered, as in GitHub's reference Pages workflow.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Slidev dependencies
        working-directory: presentation
        run: npm install --no-audit --no-fund
      - name: Build AcademyVerso Slidev
        working-directory: presentation
        run: npm run build
      - name: Assemble 3D web and presentation
        shell: bash
        run: |
          mkdir -p site/presentation
          cp -R web/. site/
          cp -R presentation/dist/. site/presentation/
          touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
