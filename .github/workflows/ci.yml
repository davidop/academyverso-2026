name: CI · AcademyVerso
on:
  push:
    branches: [main, 'feature/**', 'demo/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # Playwright 1.56.x supports Ubuntu 24.04; ubuntu-latest is 26.04 in this runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static JavaScript checks
        run: |
          node --check web/app.js
          node --check web/config.js
          node --check web/issue-prefill.mjs
          node --test worker/test/issue-prefill.test.mjs
          cd worker && npm run check && npm test
      - name: Build Slidev presentation (PR gate)
        working-directory: presentation
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Chromium for visual validation
        working-directory: presentation
        run: npx playwright install --with-deps chromium
      - name: Smoke test Slidev in Chromium
        working-directory: presentation
        run: npm run test:visual
      - name: Upload Slidev visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academyverso-visual-${{ github.run_id }}
          path: |
            presentation/test-results/
            presentation/playwright-report/
          if-no-files-found: warn
