name: CI · AcademyVerso
on:
  push:
    branches: [main, 'feature/**', 'demo/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static JavaScript checks
        run: |
          node --check web/app.js
          node --check web/worlds/spec.mjs
          node --check web/worlds/builder.mjs
          node --check web/worlds/birth.mjs
          node --check web/worlds/quality.mjs
          npm install --no-save --no-package-lock --no-audit --no-fund three@0.170.0
          node --test web/test/world-render.test.mjs
          node --check web/missions.mjs
          node --test web/test/missions.test.mjs
          node --test web/test/world-evolution-ui.test.mjs
          python scripts/test_d1_migrations.py
          python scripts/test_issue_flow.py
          node --test web/test/world-quality.test.mjs
          node --check worker/src/worldgen/foundry.mjs
          node --check worker/src/worldgen/service.mjs
          node --test web/test/world-birth.test.mjs
          node --test web/test/world-spec.test.mjs
          node --check web/config.js
          node --check web/issue-prefill.mjs
          node --check web/terraforming.mjs
          node --test web/test/terraforming.test.mjs
          node --check web/travel.mjs
          node --test web/test/travel.test.mjs
          node --check web/portal.mjs
          node --test web/test/portal.test.mjs
          node --test web/test/session-links.test.mjs
          node --test web/test/embed-mode.test.mjs
          node --test scripts/skills-sync.test.mjs
          node --test worker/test/issue-prefill.test.mjs
          python -m py_compile scripts/event-smoke.py
          cd worker && npm run check && npm test

  browser-worldgen:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser automation
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start AcademyVerso static preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory web > /tmp/academyverso-web.log 2>&1 &
          echo $! > /tmp/academyverso-web.pid
      - name: Browser smoke and real screenshots
        run: node scripts/worldgen-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academyverso-worldgen-screenshots
          path: artifacts/worldgen
          if-no-files-found: warn

  slidev-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Slidev dependencies
        working-directory: presentation
        run: npm install --no-audit --no-fund
      - name: Build presentation exactly as GitHub Pages will
        working-directory: presentation
        run: npm run build
