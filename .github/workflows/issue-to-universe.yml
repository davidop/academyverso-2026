name: Registro de objeto cósmico
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  ingest:
    if: (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.sender.login == vars.ACADEMYVERSO_TRIAGE_BOT && endsWith(vars.ACADEMYVERSO_TRIAGE_BOT, '[bot]') && github.event.label.name == 'planet:ready' && !github.event.issue.pull_request && contains(github.event.issue.body, '### Tipo de objeto') && contains(github.event.issue.body, '### Alias del explorador') && contains(github.event.issue.body, '### Nombre del objeto') && contains(github.event.issue.body, '### Descripción creativa') && contains(github.event.issue.body, 'academyverso-triage:ready:v1')) || (github.event_name == 'issue_comment' && vars.ACADEMYVERSO_WORLDGEN_ENABLED == 'true' && !github.event.issue.pull_request && (startsWith(github.event.comment.body, '/academyverso-evolve ') || startsWith(github.event.comment.body, '/academyverso-rollback ')))
    runs-on: ubuntu-latest
    steps:
      - name: Confirm triage comment
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIAGE_BOT: ${{ vars.ACADEMYVERSO_TRIAGE_BOT }}
        run: |
          gh api --paginate "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            | jq --arg bot "$TRIAGE_BOT" -s '[.[][] | select(.user.login == $bot and (.body | contains("academyverso-triage:ready:v1"))) | {id, body, created_at, user: {login: .user.login}}] | last // empty' > triage-comment.json
          if [ ! -s triage-comment.json ]; then
            echo 'Trusted triage comment not found; refusing ingestion.'
            exit 1
          fi
          # Refuse a stale factory label event if the issue was edited or closed.
          if jq -e '.body | contains("academyverso-factory:ready:v1")' triage-comment.json >/dev/null; then
            gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" > current-issue.json
            jq -e --slurpfile original "$GITHUB_EVENT_PATH" '.state == "open" and .body == $original[0].issue.body and any(.labels[]; .name == "planet:ready")' current-issue.json >/dev/null || { echo 'Factory issue changed; refusing stale ingestion'; exit 1; }
          fi
      - name: Ingest signed issue event
        env:
          WORKER_URL: https://academyverso-api.david-oliva-paredes.workers.dev
          INGEST_SECRET: ${{ secrets.ACADEMYVERSO_INGEST_SECRET }}
          GH_EVENT: ${{ toJSON(github.event) }}
        run: |
          python - <<'PY'
          import os,json,hashlib,hmac,re,urllib.request,urllib.error
          url=os.getenv('WORKER_URL','').rstrip('/')
          secret=os.getenv('INGEST_SECRET','')
          if not (url and secret):
              raise SystemExit('Falta ACADEMYVERSO_INGEST_SECRET (GitHub Actions) o la URL del Worker')
          event=json.loads(os.environ['GH_EVENT'])
          if os.path.exists('triage-comment.json'):
              with open('triage-comment.json',encoding='utf-8') as fh:
                  event['triage_comment']=json.load(fh)
          # Sign and send the exact same bytes: the Worker verifies HMAC over
          # the raw body, including the attached triage comment.
          payload=json.dumps(event,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          sig=hmac.new(secret.encode(),payload,hashlib.sha256).hexdigest()
          req=urllib.request.Request(url+'/api/ingest',data=payload,method='POST',headers={
            'content-type':'application/json',
            'accept':'application/json',
            'user-agent':'AcademyVerso-GitHub-Actions/1.0',
            'x-academyverso-signature':'sha256='+sig})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  reply=json.loads(r.read(500).decode('utf-8'))
                  expected=event['issue']['number']
                  if not reply.get('ok') or reply.get('issue_number')!=expected:
                      raise SystemExit('Respuesta de ingesta no confirmada; no se cerrará la Issue')
                  comment=event.get('triage_comment',{}).get('body','')
                  if 'academyverso-factory:ready:v1' in comment:
                      hashes=re.findall(r'^factory-spec-sha256: ([0-9a-f]{64})
          except urllib.error.HTTPError as e:
              # Only print the public HTTP status and a short, bounded error body.
              # Never print the signature, payload, or configured secret.
              print('ingest failed status',e.code,'server',e.headers.get('server','unknown'))
              print('response',e.read(350).decode('utf-8',errors='replace'))
              raise SystemExit(1)
          PY
      - name: Close Issue after confirmed D1 ingestion
        if: ${{ github.event_name == 'issues' && github.event.issue.state == 'open' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method PATCH "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" \
            --field state=closed --field state_reason=completed \
            --jq '{number: .number, state: .state, state_reason: .state_reason}'
,comment,re.M)
                      if len(hashes)!=1 or reply.get('spec_sha256')!=hashes[0]:
                          raise SystemExit('WorldSpec no confirmado; no se cerrará la Issue')
                  print('ingest status',r.status,'issue_number',expected,'confirmed',True)
          except urllib.error.HTTPError as e:
              # Only print the public HTTP status and a short, bounded error body.
              # Never print the signature, payload, or configured secret.
              print('ingest failed status',e.code,'server',e.headers.get('server','unknown'))
              print('response',e.read(350).decode('utf-8',errors='replace'))
              raise SystemExit(1)
          PY
      - name: Close Issue after confirmed D1 ingestion
        if: ${{ github.event_name == 'issues' && github.event.issue.state == 'open' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method PATCH "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" \
            --field state=closed --field state_reason=completed \
            --jq '{number: .number, state: .state, state_reason: .state_reason}'
