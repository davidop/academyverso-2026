name: Registro de objeto cósmico
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  ingest:
    if: (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'planet:ready' && !github.event.issue.pull_request && contains(github.event.issue.body, '### Tipo de objeto') && contains(github.event.issue.body, '### Alias del explorador') && contains(github.event.issue.body, '### Nombre del objeto') && contains(github.event.issue.body, '### Descripción creativa') && contains(github.event.issue.body, '[academyverso-triage:ready:v1]')) || (github.event_name == 'issue_comment' && vars.ACADEMYVERSO_WORLDGEN_ENABLED == 'true' && !github.event.issue.pull_request && (startsWith(github.event.comment.body, '/academyverso-evolve ') || startsWith(github.event.comment.body, '/academyverso-rollback ')))
    runs-on: ubuntu-latest
    steps:
      - name: Confirm triage comment
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          comments="$(gh api --paginate "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" --jq '.[] | select(.body | contains("[academyverso-triage:ready:v1]")) | .id')"
          if [ -z "$comments" ]; then
            echo 'Triage marker comment not found; refusing ingestion.'
            exit 1
          fi
      - name: Ingest signed issue event
        env:
          WORKER_URL: https://academyverso-api.david-oliva-paredes.workers.dev
          INGEST_SECRET: ${{ secrets.ACADEMYVERSO_INGEST_SECRET }}
          GH_EVENT: ${{ toJSON(github.event) }}
        run: |
          python - <<'PY'
          import os,json,hashlib,hmac,urllib.request,urllib.error
          url=os.getenv('WORKER_URL','').rstrip('/')
          secret=os.getenv('INGEST_SECRET','')
          if not (url and secret):
              raise SystemExit('Falta ACADEMYVERSO_INGEST_SECRET (GitHub Actions) o la URL del Worker')
          payload=os.environ['GH_EVENT'].encode()
          sig=hmac.new(secret.encode(),payload,hashlib.sha256).hexdigest()
          req=urllib.request.Request(url+'/api/ingest',data=payload,method='POST',headers={
            'content-type':'application/json',
            'accept':'application/json',
            'user-agent':'AcademyVerso-GitHub-Actions/1.0',
            'x-academyverso-signature':'sha256='+sig})
          try:
              with urllib.request.urlopen(req,timeout=25) as r:
                  reply=json.loads(r.read(500).decode('utf-8'))
                  expected=json.loads(os.environ['GH_EVENT'])['issue']['number']
                  if not reply.get('ok') or reply.get('issue_number')!=expected:
                      raise SystemExit('Respuesta de ingesta no confirmada; no se cerrará la Issue')
                  print('ingest status',r.status,'issue_number',expected,'confirmed',True)
          except urllib.error.HTTPError as e:
              # Only print the public HTTP status and a short, bounded error body.
              # Never print the signature, payload, or configured secret.
              print('ingest failed status',e.code,'server',e.headers.get('server','unknown'))
              print('response',e.read(350).decode('utf-8',errors='replace'))
              raise SystemExit(1)
          PY
      - name: Close Issue after confirmed D1 ingestion
        if: ${{ github.event_name == 'issues' && github.event.issue.state == 'open' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method PATCH "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" \
            --field state=closed --field state_reason=completed \
            --jq '{number: .number, state: .state, state_reason: .state_reason}'
